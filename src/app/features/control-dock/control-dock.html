<div class="dock" [class.open]="open()">
  <button
    type="button"
    class="handle"
    (click)="toggleOpen()"
    [attr.aria-expanded]="open()"
    aria-controls="dock-panel"
  >
    <span class="clock mono" aria-hidden="true">{{ time() }}</span>
    <span class="chev" aria-hidden="true"></span>
    <span class="sr-only">{{ open() ? 'Hide controls' : 'Show controls' }}</span>
  </button>

  <div class="panel" id="dock-panel" [attr.inert]="open() ? null : ''">
    <div class="stamp">
      <p class="t mono">{{ time() }}</p>
      <p class="d">{{ day() }}</p>
    </div>

    <hr class="rule" />

    <fieldset class="group">
      <legend>
        Theme
        <span class="active-name">{{ activeTheme().label }}</span>
      </legend>
      <div class="swatches" role="radiogroup" aria-label="Colour theme">
        @for (opt of themeOptions; track opt.id) {
          <button
            type="button"
            class="swatch"
            role="radio"
            [class.on]="mode() === opt.id"
            [attr.aria-checked]="mode() === opt.id"
            [attr.aria-label]="opt.label + ', ' + opt.hint"
            [style.--sw]="opt.swatch"
            [title]="opt.label + ' — ' + opt.hint"
            (click)="pickTheme(opt.id)"
          >
            <span class="chip" aria-hidden="true"></span>
          </button>
        }
      </div>
      <p class="hint-line">{{ activeTheme().hint }}</p>
    </fieldset>

    <hr class="rule" />

    <button type="button" class="row" (click)="toggleSound()" [attr.aria-pressed]="soundOn()">
      <span class="ico" aria-hidden="true">{{ soundOn() ? '♪' : '×' }}</span>
      <span class="txt">Sound</span>
      <span class="state" [class.on]="soundOn()">{{ soundOn() ? 'On' : 'Off' }}</span>
    </button>

    <!-- Unlabelled, same as the floating launcher. Let people poke it. -->
    <button type="button" class="row play" (click)="onLaunch()" aria-label="Launch mini game">
      <span class="ico emoji" aria-hidden="true">🚀</span>
      <span class="txt emoji" aria-hidden="true">☄ &middot; ☄ &middot; ☄</span>
      <span class="state key">G</span>
    </button>
  </div>
</div>
