<div class="player" [class.open]="open()">
  <button
    type="button"
    class="handle"
    (click)="toggleOpen()"
    [attr.aria-expanded]="open()"
    aria-controls="music-panel"
    [attr.aria-label]="open() ? 'Hide music player' : 'Show music player'"
  >
    <span class="eq" [class.live]="music.playing()" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </span>
    <span class="handle-txt">{{ music.playing() ? music.current().name : 'Music' }}</span>
  </button>

  <div class="panel" id="music-panel" [attr.inert]="open() ? null : ''">
    <p class="now">
      <span class="nm">{{ music.current().name }}</span>
      <span class="vb mono">{{ music.current().vibe }}</span>
    </p>

    <canvas #viz class="viz" aria-hidden="true"></canvas>

    <div class="controls">
      <button type="button" class="ct" (click)="music.prev()" aria-label="Previous track">
        <span class="prev" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="ct big"
        (click)="togglePlay()"
        [attr.aria-label]="music.playing() ? 'Pause' : 'Play'"
      >
        @if (music.playing()) {
          <span class="pause" aria-hidden="true"><i></i><i></i></span>
        } @else {
          <span class="play" aria-hidden="true"></span>
        }
      </button>

      <button type="button" class="ct" (click)="music.next()" aria-label="Next track">
        <span class="next" aria-hidden="true"></span>
      </button>

      <label class="vol">
        <span class="sr-only">Volume</span>
        <input
          type="range"
          min="0"
          max="100"
          step="1"
          [value]="music.volume() * 100"
          (input)="onVolume($event)"
        />
      </label>
    </div>

    <ul class="list">
      @for (t of music.tracks; track t.name; let i = $index) {
        <li>
          <button type="button" [class.on]="music.index() === i" (click)="pick(i)">
            <span class="ix mono">{{ i + 1 }}</span>
            <span class="tn">{{ t.name }}</span>
            <span class="bpm mono">{{ t.bpm }}</span>
          </button>
        </li>
      }
    </ul>

    <p class="disclaimer">
      Original loops, generated live in your browser. Daft-Punk-inspired, not
      Daft Punk.
    </p>
  </div>
</div>
