<section id="experience" class="experience">
  <div class="container">
    <div appReveal>
      <h2 class="section-title">
        <span class="idx">02</span>
        <span class="glitch" data-text="Experience">Experience</span>
      </h2>
    </div>

    <ol class="timeline">
      @for (item of data.experience(); track item.company + item.duration) {
        <li class="entry" appReveal="left" [revealDelay]="$index * 70">
          <span class="node" [class.live]="item.current" aria-hidden="true"></span>

          <article class="card neon" appTilt [tiltMax]="3">
            <header class="head">
              <h3>
                {{ item.role }}
                <span class="at">@ {{ item.company }}</span>
              </h3>
              <p class="duration mono">
                {{ item.duration }}
                @if (item.current) {
                  <span class="now">Now</span>
                }
              </p>
            </header>

            <ul class="points">
              @for (line of item.description; track line) {
                <li>{{ line }}</li>
              }
            </ul>
          </article>
        </li>
      }
    </ol>
  </div>
</section>
