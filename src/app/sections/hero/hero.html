<section id="hero" class="hero">
  <span class="grid-floor" aria-hidden="true"></span>

  <div class="container hero-inner">
    <div class="hero-text" appReveal>
      <p class="status">
        <span class="beacon" aria-hidden="true"></span>
        Product @ Biz2X &middot; {{ data.contact.location }}
      </p>

      <h1>
        <span class="hi mono">&gt; HI, I'M</span>
        <span class="name chroma">{{ data.name }}</span>
      </h1>

      <p class="typeline" aria-live="polite">
        <span class="typed">{{ typed() }}</span><span
          class="caret"
          [class.blink]="caretOn()"
          aria-hidden="true"
        ></span>
      </p>

      <p class="lede">{{ data.intro }}</p>

      <div class="hero-links">
        <a class="btn btn-primary" [href]="data.contact.resume" download>Résumé</a>
        <a class="btn" [href]="data.contact.linkedin" target="_blank" rel="noopener noreferrer">
          LinkedIn
        </a>
        <a class="btn btn-ghost" [href]="'mailto:' + data.contact.email">Email</a>

        <!-- No label. Curiosity is the point. -->
        <button
          type="button"
          class="btn mystery"
          (click)="ui.openGame()"
          aria-label="Launch mini game"
        >
          <span class="emoji" aria-hidden="true">🚀</span>
          <span class="rock emoji" aria-hidden="true">☄</span>
        </button>
      </div>

      <p class="keys mono">
        <button type="button" class="kbtn" (click)="ui.openPalette()">
          <kbd>Ctrl</kbd><kbd>K</kbd> commands
        </button>
        <span><kbd>T</kbd> theme</span>
        <span><kbd>A</kbd> ascii</span>
        <span><kbd>D</kbd> doodle</span>
        <span><kbd>F</kbd> no gravity</span>
      </p>
    </div>

    <div class="hero-media" appReveal="scale">
      <div class="orb">
        <span class="ring r1" aria-hidden="true"></span>
        <span class="ring r2" aria-hidden="true"></span>
        <span class="halo" aria-hidden="true"></span>
        <img
          class="avatar"
          [src]="avatarSrc"
          alt="Portrait of {{ data.name }}"
          width="240"
          height="240"
          fetchpriority="high"
        />
      </div>
    </div>
  </div>

  <a href="#about" class="scroll-cue" aria-label="Scroll to About">
    <span class="mouse" aria-hidden="true"><span class="wheel"></span></span>
    <span class="cue-text">Scroll</span>
  </a>
</section>
