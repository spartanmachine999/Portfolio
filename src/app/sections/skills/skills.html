<section id="skills" class="skills">
  <div class="container">
    <div appReveal>
      <h2 class="section-title">
        <span class="idx">04</span>
        <span class="glitch" data-text="Skills &amp; Competencies">Skills &amp; Competencies</span>
      </h2>
    </div>

    <div class="groups">
      @for (group of groups(); track group.key) {
        <div class="group" appReveal [revealDelay]="$index * 90">
          <h3>
            {{ group.title }}
            <span class="count mono">{{ group.items.length }}</span>
          </h3>
          <div class="badges" appReveal stagger>
            @for (item of group.items; track item) {
              <span class="badge">{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
