<a class="skip-link" href="#about">Skip to content</a>

<app-starfield />
<app-scroll-progress />
<app-cursor />
<span class="crt-band" aria-hidden="true"></span>

<app-header />

<main id="main">
  <app-hero (playGame)="openGame()" (openPalette)="openPalette()" />

  <!-- Track is duplicated so the marquee can loop seamlessly at -50%. -->
  <div class="ticker" aria-hidden="true">
    <div class="ticker-track">
      @for (item of tickerItems; track $index) {
        <span><b>//</b> {{ item }}</span>
      }
      @for (item of tickerItems; track $index) {
        <span><b>//</b> {{ item }}</span>
      }
    </div>
  </div>

  <app-about />
  <app-experience />
  <app-projects />
  <app-skills />
</main>

<app-footer />

<app-control-dock (launchGame)="openGame()" />
<app-music-player />

<!-- Unlabelled on purpose: the rocket and asteroid are the whole invitation.
     The aria-label still describes it properly for screen readers, who can't
     "explore" a mystery button. -->
<button type="button" class="game-fab" (click)="openGame()" aria-label="Launch mini game">
  <!-- Literal character, not &#128640;. Numeric entities above U+FFFF get
       truncated to 16 bits here, producing U+F680 (a Private Use Area glyph
       that renders as tofu) instead of the rocket. -->
  <span class="fab-rocket emoji" aria-hidden="true">🚀</span>
  <!-- Comet glyph comes from .fab-rock::before so it can counter-rotate
       inside the orbiting wrapper. Intentionally empty. -->
  <span class="fab-rock emoji" aria-hidden="true"></span>
  <span class="fab-pulse" aria-hidden="true"></span>
</button>

@if (toast()) {
  <div class="toast" [class.out]="toastLeaving()" role="status" aria-live="polite">
    <span>{{ toast() }}</span>
  </div>
}

@defer (when paletteOpen()) {
  @if (paletteOpen()) {
    <app-command-palette (closed)="closePalette()" (playGame)="openGame()" />
  }
}

@defer (when gameOpen()) {
  @if (gameOpen()) {
    <app-asteroid-game (closed)="closeGame()" />
  }
}
