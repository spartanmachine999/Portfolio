<app-footer />

<app-control-dock (launchGame)="openGame()" />

<!-- Deferred so the game's code is a separate chunk and never weighs down
     the first paint. It only downloads once someone actually asks for it. -->
@defer (when gameOpen()) {
  @if (gameOpen()) {
    <app-asteroid-game (closed)="closeGame()" />
  }
}
