<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="container nav">
    <a href="#hero" class="brand" (click)="onNavClick()">
      <span class="mark" aria-hidden="true">MS</span>
      <span class="who">Mohak Saxena</span>
    </a>

    <nav class="links" aria-label="Primary">
      @for (link of links; track link.id) {
        <a
          [href]="'#' + link.id"
          [class.active]="activeId() === link.id"
          [attr.aria-current]="activeId() === link.id ? 'true' : null"
          (click)="onNavClick()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <button
      type="button"
      class="burger"
      [class.x]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      [attr.aria-label]="menuLabel()"
    >
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
  </div>

  <nav
    class="drawer"
    id="mobile-nav"
    [class.open]="menuOpen()"
    [attr.inert]="menuOpen() ? null : ''"
    aria-label="Mobile"
  >
    @for (link of links; track link.id) {
      <a
        [href]="'#' + link.id"
        [class.active]="activeId() === link.id"
        (click)="onNavClick()"
      >
        {{ link.label }}
      </a>
    }
  </nav>
</header>
