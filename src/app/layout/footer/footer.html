<footer class="site-footer">
  <div class="container">
    <div class="top">
      <div class="cta">
        <h2>Let's build something. <span class="emoji" aria-hidden="true">🛠️</span></h2>
        <p>Open to interesting product problems and good conversation.</p>
        <a class="btn btn-primary" [href]="'mailto:' + data.contact.email">
          <span class="emoji" aria-hidden="true">👋</span>
          <span>Get in touch</span>
        </a>
      </div>

      <ul class="contact">
        <li>
          <span class="k"><span class="emoji" aria-hidden="true">✉️</span> Email</span>
          <a [href]="'mailto:' + data.contact.email">{{ data.contact.email }}</a>
        </li>
        <li>
          <span class="k"><span class="emoji" aria-hidden="true">📱</span> Phone</span>
          <a [href]="'tel:+91' + data.contact.phone">{{ data.contact.phone }}</a>
        </li>
        <li>
          <span class="k"><span class="emoji" aria-hidden="true">🔗</span> LinkedIn</span>
          <a [href]="data.contact.linkedin" target="_blank" rel="noopener noreferrer">
            /mohaksaxena16
          </a>
        </li>
        <li>
          <span class="k"><span class="emoji" aria-hidden="true">📍</span> Location</span>
          <span>{{ data.contact.location }}</span>
        </li>
      </ul>
    </div>

    <hr class="rule" />

    <div class="bottom">
      <p class="copy">&copy; {{ year }} {{ data.name }}</p>
      <button type="button" class="top-btn" (click)="toTop()">
        <span class="arrow" aria-hidden="true"></span>
        Back to top
      </button>
    </div>
  </div>
</footer>
